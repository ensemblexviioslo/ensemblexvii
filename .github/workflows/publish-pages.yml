name: Publiser Ensemble XVII

'on':
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hent kildefiler
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Klargjør GitHub Pages
        uses: actions/configure-pages@v5

      - name: Samle nettsidefilene
        run: |
          mkdir _site
          cp index.html styles.css .nojekyll _site/
          cp -R assets _site/
          find _site -name .DS_Store -type f -delete

      - name: Last opp nettsidefilene
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publiser nettsiden
        id: deployment
        uses: actions/deploy-pages@v4
